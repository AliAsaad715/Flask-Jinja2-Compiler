{% extends "base.html" %}

{% block title %}إضافة منتج - متجر المنتجات{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title mb-0">إضافة منتج جديد</h3>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="name" class="form-label">اسم المنتج</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">السعر (ر.س)</label>
                        <input type="number" step="0.01" class="form-control" id="price" name="price" required>
                    </div>

                    <div class="mb-3">
                        <label for="image" class="form-label">صورة المنتج</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        <div class="form-text">الامتدادات المسموحة: PNG, JPG, JPEG, GIF</div>
                    </div>

                    <div class="mb-3">
                        <label for="details" class="form-label">تفاصيل المنتج</label>
                        <textarea class="form-control" id="details" name="details" rows="5" required></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">إضافة المنتج</button>
                        <a href="{{ url_for('products_list') }}" class="btn btn-secondary">العودة للقائمة</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
