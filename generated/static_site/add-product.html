<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج - متجر المنتجات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="products.html">متجر المنتجات</a>
            <div class="navbar-nav">
                <a class="nav-link" href="products.html">المنتجات</a>
                <a class="nav-link" href="add-product.html">إضافة منتج</a>
            </div>
        </div>
    </nav>

    <main class="container page-content">
        
<div class="form-card">
    <h1>إضافة منتج جديد</h1>
    <div class="alert alert-info">تُضاف البيانات إلى مصفوفة products ثم يُعاد تشغيل المولد.</div>

    <form action="products.html" method="GET">
        <div class="mb-3">
            <label for="name" class="form-label">اسم المنتج</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">السعر</label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" required>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">اسم ملف الصورة</label>
            <input type="text" class="form-control" id="image" name="image">
        </div>

        <div class="mb-3">
            <label for="details" class="form-label">تفاصيل المنتج</label>
            <textarea class="form-control" id="details" name="details" rows="5" required></textarea>
        </div>

        <p class="form-help">هذه واجهة توضيحية للبيانات المطلوبة. تثبيت الإضافة يتم في ملف Python ثم بإعادة التوليد.</p>
        <div class="action-row">
            <button type="submit" class="btn btn-success">العودة إلى المنتجات</button>
            <a href="products.html" class="btn btn-secondary">إلغاء</a>
        </div>
    </form>
</div>

    </main>

    <footer class="site-footer">
        <div class="container">مشروع مترجم Flask وJinja2</div>
    </footer>
</body>
</html>
